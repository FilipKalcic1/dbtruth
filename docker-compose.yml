# Fixture database for tests. Port 54329 avoids clashing with a local Postgres.
# DATABASE_URL=postgres://dbtruth:dbtruth@localhost:54329/fixture
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dbtruth
      POSTGRES_PASSWORD: dbtruth
      POSTGRES_DB: fixture
    ports:
      - "54329:5432"
    volumes:
      - ./test/fixtures/seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ./test/fixtures/clean.sql:/docker-entrypoint-initdb.d/20-clean.sql:ro
      - ./test/fixtures/scale.sql:/docker-entrypoint-initdb.d/30-scale.sql:ro
    healthcheck:
      # TCP on purpose: during init the entrypoint runs a socket-only server, and a socket check passes too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dbtruth -d fixture"]
      interval: 2s
      timeout: 2s
      retries: 30
